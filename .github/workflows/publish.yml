name: Publish Package

# Push tag vX.Y.Z (must match package.json version) → npm via OIDC trusted publishing.
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

      - name: Publish @paid-tw/cli
        run: |
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag ($GITHUB_REF_NAME) must match package.json version ($ver)"
            exit 1
          fi
          if npm view "${name}@${ver}" version >/dev/null 2>&1; then
            echo "::notice::${name}@${ver} already published — skipping"
            exit 0
          fi
          npm publish --access public --provenance
